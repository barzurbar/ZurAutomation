<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>עורך סיכום פגישה</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
      color: #263238;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.07);
    }

    h2 { margin: 0 0 20px; font-size: 22px; color: #24476a; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 12px;
      background: #f5f7f9;
      border: 1px solid #dce2e8;
      border-radius: 8px 8px 0 0;
    }

    .toolbar button,
    .upload-button {
      border: 1px solid #d1d8df;
      background: #fff;
      color: #263238;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .toolbar button:hover,
    .upload-button:hover { background: #eaf0f6; }

    .toolbar button:active { background: #dce8f3; }

    #summaryEditor {
      min-height: 450px;
      padding: 22px;
      border: 1px solid #dce2e8;
      border-top: none;
      border-radius: 0 0 8px 8px;
      outline: none;
      background: #fff;
      direction: rtl;
      text-align: right;
      line-height: 1.6;
      font-size: 15px;
      overflow-wrap: break-word;
    }

    #summaryEditor:focus { border-color: #8aa9c8; }

    #summaryEditor img { max-width: 100%; height: auto; }

    .attachments-section {
      margin-top: 22px;
      padding: 16px;
      border: 1px solid #dce2e8;
      border-radius: 8px;
      background: #fafbfc;
    }

    .attachments-title { font-weight: bold; margin-bottom: 12px; }

    .attachments-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .attachment-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 12px;
      background: #fff;
      border: 1px solid #e0e5ea;
      border-radius: 6px;
      font-size: 13px;
      min-width: 0;
    }

    .attachment-name { overflow-wrap: anywhere; }

    .remove-attachment {
      border: none;
      background: transparent;
      color: #c0392b;
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
    }

    .submit-button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #24476a;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-button:hover { background: #193752; }

    .submit-button:disabled { background: #8a9baa; cursor: not-allowed; }

    .status { margin-top: 12px; text-align: center; font-size: 14px; }
    .status.error { color: #c0392b; }
    .status.success { color: #2e7d32; }

    .hidden-input { display: none; }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .container { padding: 14px; }
      #summaryEditor { min-height: 400px; padding: 14px; font-size: 15px; }
      .toolbar { gap: 5px; padding: 9px; }
      .toolbar button,
      .upload-button { padding: 8px 10px; font-size: 13px; }
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>עריכת סיכום הפגישה</h2>

    <form id="summaryForm">

      <!-- שדות מידע -->
      <input type="hidden" id="email" value="{{1.email}}">
      <input type="hidden" id="MeetingTitle" value="{{1.MeetingTitle}}">
      <input type="hidden" id="timelessID" value="{{1.timelessID}}">

      <!-- סרגל כלים -->
      <div class="toolbar">
        <button type="button" onclick="formatText('bold')" title="מודגש"><b>B</b></button>
        <button type="button" onclick="formatText('italic')" title="נטוי"><i>I</i></button>
        <button type="button" onclick="formatText('underline')" title="קו תחתון"><u>U</u></button>
        <button type="button" onclick="formatText('insertUnorderedList')" title="רשימה">• רשימה</button>
        <button type="button" onclick="formatText('insertOrderedList')" title="רשימה ממוספרת">1. רשימה</button>
        <button type="button" onclick="formatText('justifyRight')" title="יישור לימין">ימין</button>
        <button type="button" onclick="formatText('justifyCenter')" title="מרכוז">מרכז</button>
        <button type="button" onclick="formatText('justifyLeft')" title="יישור לשמאל">שמאל</button>
        <button type="button" onclick="formatText('removeFormat')" title="ניקוי עיצוב">ניקוי עיצוב</button>
        <button type="button" onclick="document.getElementById('imageInput').click()">🖼️ הוספת תמונה</button>
      </div>

      <!-- בחירת תמונה להטמעה בתוך הסיכום -->
      <input type="file" id="imageInput" class="hidden-input" accept="image/*">

      <!-- עורך התוכן -->
      <div id="summaryEditor" contenteditable="true" spellcheck="true">{{2.`1`}}</div>

      <!-- צירוף קבצים -->
      <div class="attachments-section">
        <div class="attachments-title">📎 קבצים מצורפים</div>

        <button type="button" class="upload-button"
                onclick="document.getElementById('attachmentInput').click()">
          + הוספת קבצים
        </button>

        <input type="file" id="attachmentInput" class="hidden-input" multiple>

        <div id="attachmentsList" class="attachments-list"></div>
      </div>

      <button type="submit" id="submitButton" class="submit-button">
        שליחת סיכום הפגישה
      </button>

      <div id="status" class="status"></div>

    </form>

  </div>

  <script>
    const WEBHOOK_URL = 'https://hook.eu2.make.com/6wtcj2h6o18mui69ocgn735zx1o77ebt';

    const editor = document.getElementById('summaryEditor');
    const form = document.getElementById('summaryForm');
    const imageInput = document.getElementById('imageInput');
    const attachmentInput = document.getElementById('attachmentInput');
    const attachmentsList = document.getElementById('attachmentsList');
    const submitButton = document.getElementById('submitButton');
    const status = document.getElementById('status');

    let selectedFiles = [];

    function formatText(command) {
      editor.focus();
      document.execCommand(command, false, null);
    }

    // הוספת תמונה לתוך תוכן הסיכום
    imageInput.addEventListener('change', function (event) {
      const file = event.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        alert('יש לבחור קובץ תמונה בלבד');
        imageInput.value = '';
        return;
      }

      const reader = new FileReader();

      reader.onload = function (e) {
        editor.focus();

        const image = document.createElement('img');
        image.src = e.target.result;
        image.alt = file.name;
        image.style.maxWidth = '100%';
        image.style.height = 'auto';
        image.style.display = 'block';
        image.style.margin = '12px 0';

        const selection = window.getSelection();

        if (selection && selection.rangeCount > 0 &&
            editor.contains(selection.anchorNode)) {
          const range = selection.getRangeAt(0);
          range.deleteContents();
          range.insertNode(image);
          range.setStartAfter(image);
          range.collapse(true);
          selection.removeAllRanges();
          selection.addRange(range);
        } else {
          editor.appendChild(image);
        }
      };

      reader.readAsDataURL(file);
      imageInput.value = '';
    });

    // הוספת קבצים לרשימת הקבצים המצורפים
    attachmentInput.addEventListener('change', function (event) {
      Array.from(event.target.files).forEach(file => {
        const alreadyExists = selectedFiles.some(existing =>
          existing.name === file.name &&
          existing.size === file.size &&
          existing.lastModified === file.lastModified
        );
        if (!alreadyExists) selectedFiles.push(file);
      });

      renderAttachments();
      attachmentInput.value = ''; // מאפשר לבחור שוב את אותו הקובץ
    });

    function renderAttachments() {
      attachmentsList.innerHTML = '';

      selectedFiles.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'attachment-item';

        const name = document.createElement('span');
        name.className = 'attachment-name';
        name.textContent = file.name + ' (' + formatFileSize(file.size) + ')';

        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.className = 'remove-attachment';
        removeButton.textContent = '×';
        removeButton.title = 'הסרת קובץ';
        removeButton.addEventListener('click', function () {
          selectedFiles.splice(index, 1);
          renderAttachments();
        });

        item.appendChild(name);
        item.appendChild(removeButton);
        attachmentsList.appendChild(item);
      });
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    // קריאת קובץ כ-Base64 נקי (בלי הקידומת data:...;base64,)
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = reader.result;
          resolve(result.substring(result.indexOf(',') + 1));
        };
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    // שליחה ל-Make כ-JSON שטוח:
    // files = [ { fileName, mimeType, fileSize, data }, ... ]
    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      submitButton.disabled = true;
      submitButton.textContent = 'הסיכום נשלח...';
      status.className = 'status';
      status.textContent = 'הנתונים והקבצים נשלחים למערכת...';

      try {
        const files = await Promise.all(selectedFiles.map(async file => ({
          fileName: file.name,
          mimeType: file.type || 'application/octet-stream',
          fileSize: file.size,
          data: await fileToBase64(file)
        })));

        const payload = {
          email: document.getElementById('email').value,
          MeetingTitle: document.getElementById('MeetingTitle').value,
          timelessID: document.getElementById('timelessID').value,
          editedHtml: editor.innerHTML,
          files: files
        };

        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        status.className = 'status success';
        status.textContent = 'הסיכום נשלח בהצלחה ✔';
        submitButton.textContent = 'נשלח ✔';

      } catch (error) {
        console.error(error);
        status.className = 'status error';
        status.textContent = 'השליחה נכשלה, נסו שוב. (' + error.message + ')';
        submitButton.disabled = false;
        submitButton.textContent = 'שליחת סיכום הפגישה';
      }
    });
  </script>

</body>
</html>
